<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <pattern id="hatch" width="10" height="10" patternTransform="rotate(25)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#26301F" stroke-width="1" opacity="0.06" />
    </pattern>
  </defs>
  <rect width="400" height="280" fill="#F6F0DE" />
  <rect width="400" height="280" fill="url(#hatch)" />
  <rect x="1.5" y="1.5" width="397" height="277" fill="none" stroke="#C9BD93" stroke-width="3" />

  <!-- folded map -->
  <g transform="rotate(-4 200 140)">
    <rect x="110" y="80" width="180" height="130" fill="#FBF6E4" stroke="#3F5A38" stroke-width="3" />
    <line x1="170" y1="80" x2="170" y2="210" stroke="#C9BD93" stroke-width="2" stroke-dasharray="4 5" />
    <line x1="230" y1="80" x2="230" y2="210" stroke="#C9BD93" stroke-width="2" stroke-dasharray="4 5" />

    <!-- dotted trail -->
    <path d="M132 190 Q160 150 150 120 Q145 100 190 100 Q235 100 250 130 Q262 155 250 175"
          fill="none" stroke="#2B5E52" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round" />

    <!-- X marks the spot -->
    <g stroke="#8A4433" stroke-width="4" stroke-linecap="round">
      <line x1="242" y1="167" x2="258" y2="183" />
      <line x1="258" y1="167" x2="242" y2="183" />
    </g>
  </g>
</svg>
