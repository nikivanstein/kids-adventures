<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <pattern id="hatch" width="10" height="10" patternTransform="rotate(25)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#26301F" stroke-width="1" opacity="0.06" />
    </pattern>
  </defs>
  <rect width="400" height="280" fill="#F6F0DE" />
  <rect width="400" height="280" fill="url(#hatch)" />
  <rect x="1.5" y="1.5" width="397" height="277" fill="none" stroke="#C9BD93" stroke-width="3" />

  <!-- key -->
  <g transform="rotate(-28 200 140)">
    <circle cx="150" cy="140" r="30" fill="none" stroke="#9C6E1E" stroke-width="8" />
    <line x1="180" y1="140" x2="262" y2="140" stroke="#9C6E1E" stroke-width="8" stroke-linecap="round" />
    <line x1="234" y1="140" x2="234" y2="162" stroke="#9C6E1E" stroke-width="8" stroke-linecap="round" />
    <line x1="252" y1="140" x2="252" y2="156" stroke="#9C6E1E" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- ribbon loop through the bow -->
  <path d="M132 110 Q104 128 118 156 Q130 178 108 186" fill="none" stroke="#8A4433" stroke-width="5" stroke-linecap="round" />
</svg>
